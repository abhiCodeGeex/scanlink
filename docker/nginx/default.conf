server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 100M;
    fastcgi_read_timeout 120s;

    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    # Livewire/Filament routes must hit PHP — never treat these as static files.
    location ^~ /livewire {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /livewire- {
        try_files $uri /index.php?$query_string;
    }

    # Only cache real public asset directories (not dynamic *.js routes).
    location ~* ^/(?:css|js|fonts|images|build)/.+\.(?:css|js|map|jpg|jpeg|gif|png|webp|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
