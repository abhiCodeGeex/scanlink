; Local Docker PHP performance
memory_limit=512M
max_execution_time=120

; Form-submission photo uploads. The php:*-fpm images ship NO php.ini, so PHP falls back
; to its compiled-in defaults of upload_max_filesize=2M / post_max_size=8M. A photo taken
; on a phone is 2-5MB, so every one of them was rejected by PHP with UPLOAD_ERR_INI_SIZE
; before the app ever saw it: the text answers saved and the photo vanished with no error.
; nginx already allows 100M (docker/nginx/default.conf client_max_body_size).
upload_max_filesize=32M
post_max_size=64M
max_file_uploads=60
realpath_cache_size=4096K
realpath_cache_ttl=600

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Stat PHP files at most every 60s (revalidate_freq=0 was rescanning every request on Windows mounts).
opcache.validate_timestamps=1
opcache.revalidate_freq=60
opcache.save_comments=1
