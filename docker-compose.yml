services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scanlink-laravel-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      # Keep hot Laravel I/O off the Windows bind mount.
      - storage_framework:/var/www/html/storage/framework
      - bootstrap_cache:/var/www/html/bootstrap/cache
    expose:
      - "9000"
    ports:
      - "5173:5173"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.docker
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: scanlink_laravel
      DB_USERNAME: scanlink
      DB_PASSWORD: scanlink
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis

  nginx:
    image: nginx:1.27-alpine
    container_name: scanlink-laravel-nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - storage_framework:/var/www/html/storage/framework
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: scanlink-laravel-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: scanlink_laravel
      MYSQL_USER: scanlink
      MYSQL_PASSWORD: scanlink
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: scanlink-laravel-redis
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: scanlink-laravel-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    platform: linux/amd64
    container_name: scanlink-laravel-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: scanlink
      PMA_PASSWORD: scanlink
      UPLOAD_LIMIT: 512M
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  vendor_data:
  storage_framework:
  bootstrap_cache:
